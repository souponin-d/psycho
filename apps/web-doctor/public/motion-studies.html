<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Исследования motion · Синкли</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Onest, Arial, sans-serif;
        color: #1c2924;
        background: #f5f7f2;
      }
      button {
        font: inherit;
      }
      .head {
        padding: 22px clamp(20px, 4vw, 64px) 12px;
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 20px;
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.035em;
        margin: 0 0 5px;
      }
      .head p {
        margin: 0;
        color: #5c6b5e;
        font-size: 13px;
      }
      .head a {
        color: #355e4a;
        text-underline-offset: 4px;
        white-space: nowrap;
      }
      .choices {
        display: flex;
        gap: 8px;
        padding: 12px clamp(20px, 4vw, 64px) 18px;
        overflow-x: auto;
      }
      .choices button {
        flex: none;
        border: 1px solid #cbd7ca;
        background: #fff;
        border-radius: 9px;
        padding: 10px 17px;
        min-height: 44px;
        cursor: pointer;
      }
      .choices button[aria-current="true"] {
        background: #355e4a;
        color: #fff;
        border-color: #355e4a;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #88a977;
        outline-offset: 3px;
      }
      .stage {
        position: relative;
        height: min(740px, calc(100dvh - 170px));
        min-height: 420px;
        margin: 0 clamp(20px, 4vw, 64px) 20px;
        overflow: hidden;
        border-radius: 18px;
        background: var(--stage, #e9f0e5);
        box-shadow: 0 22px 60px #1a352314;
        transition: background 400ms ease-out;
      }
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 50%,
          var(--light, #ffffff) 0%,
          transparent 56%
        );
        opacity: 0.8;
        pointer-events: none;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .fallback {
        position: absolute;
        inset: 17% 30%;
        border: 3px solid var(--fallback, #6a9d67);
        border-radius: 46%;
        transform: rotate(-25deg);
        opacity: 0.4;
      }
      .fallback[hidden] {
        display: none;
      }
      .stage-footer {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 18px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
      }
      .caption {
        padding: 12px 15px;
        background: #ffffffc9;
        border: 1px solid #ffffffb8;
        border-radius: 10px;
        backdrop-filter: blur(12px);
        max-width: 560px;
      }
      .caption h2 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .caption p {
        font-size: 12px;
        margin: 0;
        line-height: 1.5;
        color: #526355;
      }
      .pause {
        pointer-events: auto;
        border: 1px solid #879f86;
        color: #21422c;
        background: #ffffffd9;
        border-radius: 8px;
        min-height: 44px;
        padding: 8px 15px;
        cursor: pointer;
      }
      .foot {
        margin: 0 clamp(20px, 4vw, 64px) 25px;
        color: #5c6b5e;
        font-size: 12px;
      }
      @media (max-width: 700px) {
        .head {
          flex-direction: column;
        }
        .stage {
          height: min(70dvh, 620px);
        }
        .stage-footer {
          align-items: stretch;
        }
        .caption {
          max-width: 72%;
        }
        .pause {
          align-self: end;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="head">
      <div>
        <h1>Пять фигур для HERO входа</h1>
        <p>
          Отдельные анимации частиц — без макета страницы. Выберите форму и
          цвет.
        </p>
      </div>
      <a href="/">Вернуться ко входу</a>
    </header>
    <nav class="choices" aria-label="Выбор анимации">
      <button data-choice="1" type="button">1 · Лента Мёбиуса</button>
      <button data-choice="2" type="button">2 · Двойная спираль</button>
      <button data-choice="3" type="button">3 · Живой цветок</button>
      <button data-choice="4" type="button">4 · Узел непрерывности</button>
      <button data-choice="5" type="button">5 · Пульсирующая сфера</button>
    </nav>
    <main class="stage" aria-labelledby="motion-title">
      <canvas aria-hidden="true"></canvas>
      <div class="fallback" hidden aria-hidden="true"></div>
      <div class="stage-footer">
        <div class="caption">
          <h2 id="motion-title"></h2>
          <p id="motion-description"></p>
        </div>
        <button type="button" class="pause">Приостановить</button>
      </div>
    </main>
    <p class="foot">
      На основной странице входа пока не выбран ни один из этих вариантов.
      Анимация останавливается при системной настройке «Уменьшение движения».
    </p>
    <script type="module" src="/motion-studies.js"></script>
  </body>
</html>
